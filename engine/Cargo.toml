[package]
name = "exo"
version = "0.11.0"
edition = "2024"
license = "MIT"
# Mínimo verificado empíricamente con cargo check --all-targets --locked:
# 1.94 falla (libsqlite3-sys usa cfg_select, estable desde 1.95), 1.95 compila.
rust-version = "1.95"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6.0.0"
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlite-vec = "=0.1.9"
toml = "0.8"
yaml_serde = "0.10.4"
# Solo con la feature `cuda`: misma versión exacta que arrastra fastembed, para
# que el `ExecutionProviderDispatch` que se le pasa sea el mismo tipo.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["cuda"], optional = true }

[features]
# Embeddings en GPU NVIDIA para `exo index`/`rebuild` (onnxruntime + CUDA EP).
# Off por defecto: exige en el sistema el runtime CUDA y cuDNN 9 de la rama que
# elija ort-sys (`ORT_CUDA_VERSION=12|13` al compilar). Ver docs/instalacion.md.
cuda = ["dep:ort"]

[dev-dependencies]
tempfile = "3.14"
