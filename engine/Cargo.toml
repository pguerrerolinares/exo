[package]
name = "exo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6.0.0"
fastembed = { version = "5.17.3", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
regex = "1.13.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlite-vec = "=0.1.9"
toml = "0.8"
yaml_serde = "0.10.4"

[dev-dependencies]
tempfile = "3.14"
