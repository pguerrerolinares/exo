name: Release

on:
  push:
    tags: ['v*']
  # Re-publicar un tag ya existente sin volver a moverlo: un push de tag no se
  # repite, y borrar y re-empujar un tag público es peor que un botón.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag ya existente a publicar (p. ej. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # F6 (docs/backlog.md:785-819): mismo fix que ci.yml — ver ese fichero
  # para el porqué completo.
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  # Job barato (segundos, sin toolchain de Rust) que se dispara ANTES de la
  # matriz de builds (hasta 3×60 min). Antes de esta tarea, la comprobación
  # de versiones vivía DENTRO de `publish`, tras `needs: build` — un
  # `workflow_dispatch` con un tag que no casara con `engine/Cargo.toml`
  # gastaba la matriz entera antes de fallar (medido: v0.1.0 lo habría hecho,
  # docs/backlog.md).
  version-check:
    name: el tag casa con engine/Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: scripts/test-versiones.sh
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/test-versiones.sh "$TAG"

  build:
    name: ${{ matrix.target }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Sin fail-fast: si macOS cae, se quiere ver si linux y windows
      # compilaron. Quien impide que una release coja se publique NO es el
      # gate de inventario de `publish`, sino su `needs: build`: si cualquier
      # leg de la matriz falla, el job `build` concluye en `failure` y
      # `publish` ni arranca. El inventario es la segunda línea.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: exo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: exo.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: exo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: release-${{ matrix.target }}
      # Mismo pineado que ci.yml (fuente de verdad: REVISION_JINA_ES en
      # engine/src/lib.rs). Las tres plataformas de esta matriz son nativas
      # (host == target: no hay cross-compile), así que
      # engine/scripts/test-hermetico.sh corre los tests tal cual sin tocar
      # `--target`.
      - name: Caché del modelo jina-es (revisión pineada)
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub/models--jinaai--jina-embeddings-v2-base-es
          key: hf-jina-es-8e2d780d-${{ runner.os }}
      - name: cargo build --release
        working-directory: engine
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Sin esto, un binario que compila pero no pasa la suite se publicaba
      # igual: `cargo build` no ejerce ni un test. El gate ya existe y ya se
      # demostró falsable (2026-08-27); se consume tal cual, ANTES de
      # empaquetar, para que ningún binario publicado pueda no haber pasado
      # la suite en su propio SO.
      - name: Gate hermético — suite completa sin ~/.exo/config.toml
        shell: bash
        run: ./engine/scripts/test-hermetico.sh
      - name: Empaquetar y calcular el SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="engine/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          # Sin este test, un cambio de layout de cargo publicaría una release
          # con cero binarios y el job seguiría verde.
          [ -f "$src" ] || { echo "no existe $src" >&2; exit 1; }
          out="exo-${{ matrix.target }}"
          case "${{ matrix.bin }}" in *.exe) out="$out.exe";; esac
          cp "$src" "dist/$out"
          # Ninguna de las dos herramientas esta en los tres runners:
          # `sha256sum` NO existe en macOS, y `shasum` NO existe en el bash de
          # windows-latest — medido, exit 127 en el run 34584773325, que dejo
          # la release de v0.1.0 sin publicar. `install.sh` ya llevaba este
          # fallback; el workflow que le da de comer, no.
          if command -v shasum >/dev/null 2>&1; then
            ( cd dist && shasum -a 256 "$out" > "$out.sha256" )
          else
            ( cd dist && sha256sum "$out" > "$out.sha256" )
          fi
          cat "dist/$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: exo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inventario de lo que se va a publicar
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          # Seis ficheros exactos: 3 binarios + 3 .sha256. Defensa en
          # profundidad, no la defensa principal: un runner caído ya lo para
          # `needs: build` antes de llegar aquí. Esto cubre lo que aquel no ve
          # —un artifact que sube de menos, un cambio de nombres— y el daño
          # que evita es el mismo: install.sh daría 404 en esa plataforma y
          # nadie lo sabría hasta que alguien intentara instalar.
          n="$(ls dist | wc -l)"
          [ "$n" -eq 6 ] || { echo "esperaba 6 ficheros en dist, hay $n" >&2; exit 1; }
      # Un tag que no casa con Cargo.toml publicaría binarios cuyo
      # `exo --version` dice otra cosa.
      - name: El tag casa con engine/Cargo.toml
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/test-versiones.sh "$TAG"
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "exo $TAG" \
            --notes "Binarios para linux-x86_64, windows-x86_64 y macos-arm64, cada uno con su \`.sha256\`.

          Instalación (requiere \`git\` y \`jq\`; ni Rust ni toolchain C):

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/install.sh | bash
          \`\`\`

          En PowerShell:

          \`\`\`powershell
          irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/install.ps1 | iex
          \`\`\`

          Detalle: \`docs/instalacion.md\`."
