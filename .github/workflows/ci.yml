name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo en PR: con `on.push.branches: [main]`, dos merges seguidos cancelan
  # la corrida del primero y ese commit de main queda sin veredicto — un run
  # `cancelled` no se lee como rojo, se lee como nada.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # F6 (docs/backlog.md:785-819): antes de esto, la ruta de caché dependía
  # del default de `hf-hub` 0.5.0 (Cache::from_env usa $HF_HOME/hub si está
  # puesta, ~/.cache/huggingface/hub si no) sin que nada lo dijera — un
  # upgrade de hf-hub que cambiara ese default, o un runner que empezara a
  # exportar HF_HOME por su cuenta, habría vaciado la caché en silencio,
  # siempre en verde (descarga fría de 615 MB, invisible salvo en duración).
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  static-checks:
    name: checks estáticos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: cargo fmt --check
        working-directory: engine
        run: cargo fmt --check
      # `if: always()`: en la corrida 33619930840, `cargo fmt --check` falló y
      # este step quedó `skipped` — la mitad del gate (los 12 avisos de
      # clippy llevados a cero) no reportó nada. Sin este `if`, un fmt roto
      # esconde una rotura de clippy real detrás.
      - name: cargo clippy -D warnings
        if: always()
        working-directory: engine
        run: cargo clippy --all-targets --locked -- -D warnings
      # Versión pineada por SHA256: la de la imagen del runner cambia sin
      # aviso y con ella el conjunto de avisos, que es un rojo que nadie
      # provocó. `if: always()`, igual que clippy: un fmt roto no debe
      # esconder un script roto.
      - name: shellcheck 0.11.0 sobre el bash versionado
        if: always()
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          SHELLCHECK=/tmp/shellcheck-v0.11.0/shellcheck bash scripts/test-shellcheck.sh
      - name: Versiones coherentes (plugin.json == marketplace.json)
        if: always()
        run: bash scripts/test-versiones.sh
      - name: Sin rutas de una máquina concreta en el bash versionado
        if: always()
        run: bash scripts/test-rutas-personales.sh
      - name: Documentación viva (README/arquitectura/instalación no mienten)
        if: always()
        run: bash scripts/test-docs-vivos.sh
      - name: hooks.json — eventos válidos, type=command, scripts en 100755
        if: always()
        run: bash scripts/test-hooks-json.sh

  exec-bit:
    name: scripts de plugin ejecutables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # hooks.json invoca los scripts sin `bash` delante: uno commiteado en
      # 100644 muere con `Permission denied` en el cache del plugin, y como el
      # hook es non-blocking nadie lo ve (estilo-directo.sh, exo 1.1.1). El
      # gate lee el modo del índice de git, que es lo que se publica.
      - name: Todo script bajo plugins/ (.sh o con shebang) en 100755
        run: bash scripts/test-exec-bit.sh

  msrv:
    name: MSRV declarada (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # La MSRV está declarada en engine/Cargo.toml con una nota empírica y
      # hasta hoy nada la comprobaba. Este job la hace falsable.
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: msrv
      # `dtolnay/rust-toolchain@1.95.0` (arriba) solo hace `rustup default
      # 1.95.0` — precedencia 5, la MÁS BAJA de rustup (rustup
      # doc/user-guide/src/overrides.md, «Overrides»: 1 `cargo +<toolchain>`,
      # 2 `RUSTUP_TOOLCHAIN`, 3 directory override (`rustup override`),
      # 4 fichero `rust-toolchain[.toml]`, 5 default). `engine/rust-toolchain.toml`
      # (`channel = "stable"`, campaña E Task 5) es precedencia 4 y PISA ese
      # default: sin forzar algo de precedencia más alta, `cargo check` de
      # abajo compilaría con `stable`, no con la MSRV, y este job "pasaría"
      # sin haber comprobado nada. `RUSTUP_TOOLCHAIN` es precedencia 2, gana
      # al fichero — se fija por `env:` en los dos steps que siguen.
      - name: Compilador realmente en uso == 1.95.0 (falsa el override del fichero)
        working-directory: engine
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: rustc --version | tee /dev/stderr | grep -F ' 1.95.0 '
      - name: cargo check con la MSRV
        working-directory: engine
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: cargo check --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Nueve suites indexan cuerpos no vacíos y eso descarga el ONNX de
      # jina-es (615 MB medidos) vía hf-hub. NO se marcan `#[ignore]`: un CI
      # que no ejerce indexer ni buscador es verde sin significado. La clave
      # lleva la revisión pineada del modelo, así que es inmutable: un acierto
      # de caché no vuelve a subir nada.
      # La fuente de verdad de la revisión pineada es `engine/src/lib.rs`
      # (`REVISION_JINA_ES`, hoy `8e2d780d...`). Si se bumpea la revisión hay
      # que bumpear también la clave de aquí abajo (`8e2d780d` en `key:`) a
      # mano — `actions/cache` nunca sobrescribe una clave ya guardada, así
      # que el olvido produce descarga fría permanente, invisible, y el job
      # sigue en verde.
      - name: Caché del modelo jina-es (revisión pineada)
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub/models--jinaai--jina-embeddings-v2-base-es
          key: hf-jina-es-8e2d780d-${{ runner.os }}
      # El gate ya existe y ya se demostró falsable (2026-08-27, re-demostrado
      # con --locked en la campaña E). El CI lo consume tal cual en vez de
      # reinventar el comando de test.
      - name: Gate hermético — suite completa sin ~/.exo/config.toml
        id: gate
        shell: bash
        env:
          EXO_HERMETICO_LOG: ${{ github.workspace }}/hermetico.log
        run: ./engine/scripts/test-hermetico.sh
      # Sin esto, un rojo exclusivo de un SO de la matriz era irreproducible
      # en la máquina del autor: el log completo (no solo el resumen que
      # imprime stderr) queda descargable desde la pestaña Actions.
      # `steps.gate.outcome == 'failure'`, no `always()` a secas: si un step
      # ANTERIOR al gate (checkout, toolchain, caché) falla, el gate queda
      # `skipped` y no hay `hermetico.log` que subir — con solo `always()` y
      # `if-no-files-found: error` eso da un segundo rojo ("no files found")
      # que no aporta nada, y de paso sube el log también cuando el gate va
      # en verde.
      - name: Subir el log completo del gate hermético
        if: always() && steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hermetico-log-${{ matrix.os }}
          path: hermetico.log
          if-no-files-found: error
      # Va aquí y no en `plugin-tests`: necesita el binario de release (que
      # `cargo test --release` de arriba ya dejó compilado) y el modelo ONNX
      # cacheado, porque `exo init` indexa la KB semilla del fixture.
      # `if: always()`: un rojo del gate hermético no debe esconder un contrato
      # roto detrás.
      - name: Contrato engine↔recall-inject.sh contra fixture propio
        if: always()
        shell: bash
        run: ./scripts/test-contrato-ci.sh

  plugin-tests:
    name: tests del plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Los hooks de plugins/exo corren en la máquina del usuario, en los tres
      # SO para los que se publican binarios. Hasta aquí ningún CI los
      # ejercía: test-estilo-directo.sh fallaba 0/2 y el hook llegó roto a
      # exo 1.1.1. Sin toolchain de Rust: son bash + jq + git.
      - name: Todas las suites plugins/exo/scripts/test-*.sh
        shell: bash
        run: ./scripts/test-plugin.sh

  install-gate:
    name: install gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash scripts/test-install.sh
          - os: macos-latest
            script: bash scripts/test-install.sh
          # scripts/test-install.ps1 lleva su propio gate: sale 0 solo si el
          # caso "checksum correcto instala" Y el caso "checksum manipulado
          # aborta sin dejar binario" pasan los dos.
          - os: windows-latest
            script: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
    steps:
      - uses: actions/checkout@v4
      # No hace falta toolchain de Rust ni la caché del modelo ONNX: estos
      # tests no compilan el engine ni lo ejecutan — sirven una release falsa
      # por file:// contra install.sh/install.ps1. `shell: bash` en los tres
      # SO (igual que hace el job `test` de arriba): en windows-latest invoca
      # powershell.exe desde Git Bash, que es un ejecutable normal en el PATH.
      #
      # Ninguno de los dos gates se disparaba antes de esto (2026-09-11): el
      # de bash existía sin CI que lo corriera, y el de PowerShell no existía
      # — install.ps1 llevaba tres correcciones medidas a mano y sin red de
      # regresión.
      - name: Gate de instalador — checksum manipulado aborta sin dejar binario
        shell: bash
        run: ${{ matrix.script }}
